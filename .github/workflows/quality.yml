name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: jx
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: jx_debate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jx -d jx_debate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.2
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
        env:
          DATABASE_URL: postgresql+psycopg://jx:change-me@127.0.0.1:5432/jx_debate
      - run: pnpm check
        env:
          DATABASE_URL: postgresql+psycopg://jx:change-me@127.0.0.1:5432/jx_debate
      - name: Verify portable v2.0 resources and immutable host assets
        run: >-
          uv run --package jx-core python scripts/ops/v2_resources.py validate
          --input resources/v2/RESOURCE_BUNDLE.json --asset-root resources/v2/assets
      - name: Install independent Showcase dependencies
        run: |
          uv venv --python 3.12 apps/showcase/.venv
          uv pip sync --python apps/showcase/.venv/bin/python apps/showcase/requirements-dev.txt
      - name: Test independent Showcase
        run: >-
          PYTHONPATH=apps/showcase apps/showcase/.venv/bin/python
          -m unittest discover -s apps/showcase/tests -v
      - name: Create isolated integration database
        run: |
          uv run --package jx-core python - <<'PY'
          import psycopg

          with psycopg.connect(
              "postgresql://jx:change-me@127.0.0.1:5432/postgres", autocommit=True
          ) as connection:
              connection.execute("CREATE DATABASE jx_debate_qa_agent_faults")
          PY
      - run: pnpm test:db
        env:
          DATABASE_URL: postgresql+psycopg://jx:change-me@127.0.0.1:5432/jx_debate
          TEST_DATABASE_URL: postgresql+psycopg://jx:change-me@127.0.0.1:5432/jx_debate_qa_agent_faults
      - run: pnpm --filter @jx/web exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - run: pnpm test:browser
      - name: Test independent Showcase in native browser
        run: node apps/showcase/tests/run-browser.mjs
