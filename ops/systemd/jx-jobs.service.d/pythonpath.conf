[Service]
# Jobs and Core must resolve the same versioned package set.
Environment=PYTHONPATH=/opt/jixia-debate/apps/core/src:/opt/jixia-debate/apps/jobs/src:/opt/jixia-runtime-site
ExecStart=
ExecStart=/usr/bin/env PYTHONPATH=/opt/jixia-debate/apps/core/src:/opt/jixia-debate/apps/jobs/src:/opt/jixia-runtime-site /usr/bin/python3 -m jx_jobs.cli
