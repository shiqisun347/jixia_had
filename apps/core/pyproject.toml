[project]
name = "jx-core"
version = "1.0.0"
description = "Jixia debate orchestration core foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "av>=15,<17",
  "cryptography>=45,<47",
  "fastapi==0.141.1",
  "greenlet==3.2.4",
  "httpx==0.28.1",
  "livekit==1.1.14",
  "livekit-api>=1.2.0",
  "Pillow==12.3.0",
  "psycopg[binary,pool]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.52.1",
  "websockets==17.0.1",
]

[project.scripts]
jx-core = "jx_core.cli:main"
jx-admin = "jx_core.admin_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jx_core"]
