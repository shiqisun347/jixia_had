[project]
name = "jx-jobs"
version = "2.1.0"
description = "Jixia debate background-job process boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=15,<17",
  "jx-core",
  "psycopg[binary,pool]==3.3.4",
  "greenlet==3.2.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "websockets==17.0.1",
]

[project.scripts]
jx-jobs = "jx_jobs.cli:main"

[tool.uv.sources]
jx-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jx_jobs"]
