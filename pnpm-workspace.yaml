packages:
  - apps/web
  - packages/*

# pnpm 11 denies lifecycle scripts by default. These are the only packages
# whose install scripts are required by the approved 001/002 toolchain.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  bufferutil: false
  canvas: false
  core-js: false
  edgedriver: false
  esbuild: true
  geckodriver: false
  msw: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: false
