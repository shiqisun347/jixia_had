<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1220" viewBox="0 0 1920 1220" role="img" aria-labelledby="title desc">
  <title id="title">Annotated JX-Debate interface during a free-debate opportunity</title>
  <desc id="desc">The interface shows match context, two teams of three human debaters and one AI teammate, the current floor-request state, private request ranks, side-level time budgets, a live transcript, and participant controls.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <image x="0" y="0" width="1920" height="1080" xlink:href="jx-debate-free-debate-raw.png"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(108 52)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">A</text></g>
    <g transform="translate(108 130)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">B</text></g>
    <g transform="translate(1410 130)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">B</text></g>
    <g transform="translate(520 130)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">C</text></g>
    <g transform="translate(108 370)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">D</text></g>
    <g transform="translate(1040 815)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">E</text></g>
    <g transform="translate(1810 52)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">F</text></g>
    <g transform="translate(108 974)"><circle r="19" fill="#ffffff" stroke="#0f172a" stroke-width="4"/><text y="8" fill="#0f172a">G</text></g>
  </g>
  <rect x="0" y="1080" width="1920" height="140" fill="#ffffff"/>
  <line x1="130" y1="1080" x2="1790" y2="1080" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600" fill="#0f172a">
    <g transform="translate(150 1124)"><circle r="17" fill="#0f172a"/><text x="0" y="9" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">A</text><text x="29" y="9">Match context</text></g>
    <g transform="translate(520 1124)"><circle r="17" fill="#0f172a"/><text x="0" y="9" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">B</text><text x="29" y="9">Team roster</text></g>
    <g transform="translate(830 1124)"><circle r="17" fill="#0f172a"/><text x="0" y="9" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">C</text><text x="29" y="9">Turn state</text></g>
    <g transform="translate(1120 1124)"><circle r="17" fill="#0f172a"/><text x="0" y="9" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">D</text><text x="29" y="9">Request queue</text></g>
    <g transform="translate(150 1182)"><circle r="17" fill="#0f172a"/><text x="0" y="9" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">E</text><text x="29" y="9">Time budgets</text></g>
    <g transform="translate(520 1182)"><circle r="17" fill="#0f172a"/><text x="0" y="9" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">F</text><text x="29" y="9">Live transcript</text></g>
    <g transform="translate(900 1182)"><circle r="17" fill="#0f172a"/><text x="0" y="9" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">G</text><text x="29" y="9">Controls &amp; status</text></g>
  </g>
</svg>
